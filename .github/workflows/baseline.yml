name: Baseline
on:
  pull_request:
  push:
    branches: [develop]
permissions:
  contents: read
jobs:
  go:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: gophermind_test
          POSTGRES_USER: gophermind
          POSTGRES_PASSWORD: gophermind
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U gophermind -d gophermind_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      POSTGRES_TEST_DSN: postgres://gophermind:gophermind@127.0.0.1:5432/gophermind_test?sslmode=disable
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23.12'
          cache: true
      - run: go test ./...
      - run: go build ./cmd/...
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm run build
